<h1>店算 · inscode 8 批喂投包（严格按 0 → 7 顺序）</h1>
<div class="tip">用法：点每块右上角「复制」→ 粘进 inscode 对话框发送。<b>上一批验收全过，再进下一批。</b>每批自包含，不依赖上下文。</div>
<div class="warn">⚠️ <b>批次 0（工程地基）不可跳过、不可简化</b> —— 地基打歪，后面 7 批全部返工。批次 0 的「明确禁止」8 条必须逐条写死。</div>

<script>
const BLOCKS = [{"n": 0, "label": "批次 0 · 工程地基（项目初始化+鉴权中间件+错误码+表结构+时间工具+软删过滤）⚠️不可跳过", "text": "# 批次 0 / 8 · 工程地基（项目初始化 + 鉴权中间件 + 统一错误码 + 基础表结构 + 时间工具 + 软删过滤层）\n\n## 1. 批次定位\n\n这是整个项目的**第 0 批**，在 POC 算法（1~3 批）、页面（4 批）、付费（5 批）、后台（6 批）**之前**完成。\n**核心目标**：把所有业务都会复用的**公共能力**一次建好，让后续每一批生成的云函数**生来就带鉴权、带统一错误码、走服务端时间、默认过滤软删**。\n⚠️ **地基打歪，后面 7 批全部返工**，所以本批**只做地基，不做任何业务**。\n\n## 2. 完整需求\n\n### 2.1 项目与分层\n- 微信小程序原生 + 微信云开发（不用服务器）。目录：`miniprogram/`（前端）、`cloudfunctions/`（云函数，按模块分目录）。\n- **分层铁律**：Controller / Service / DataAdapter / Utils 四层；**Service 层禁止引入云开发 SDK**（便于单测与复用）。\n- **计算下沉**：所有金额/成本/利润计算在云函数完成，**前端传来的计算结果一律丢弃不采信**，由 Service 用原始录入数据重算。\n\n### 2.2 鉴权中间件（本批最重要）\n1. **绝不信任前端传来的 `user_id` / `shop_id` / `openid`**。一律用 `cloud.getWXContext().OPENID` 取可信身份；前端传来的身份字段**一律丢弃**。\n2. 中间件统一解析：`const { OPENID } = cloud.getWXContext()` → 查 `user` 表 → 得到 `user.id`。**若 openid 无对应 `user` 记录（首次进入），自动建档**：插入 `user`（`openid`→`user_id`）＋ 一个默认 `shop` ＋ `shop_entitlement`（`user_id` 唯一，`expire_at=0` 视为免费档），建档动作写 `audit_log`；建档完成后再继续业务逻辑（**不要**返回 `USER_NOT_FOUND`，首次建档是常态而非异常，否则 `payQueryEntitlement` 会查不到权限记录）。\n3. **所有涉及店铺的操作必须做归属校验**：`shop.user_id === user.id`，否则返回 `FORBIDDEN`。缺这一步 = 越权漏洞。\n4. **写操作必须校验 `client_request_id` 幂等**：同一 id 重复请求直接返回首次结果，不重复写入。\n5. **按 openid 维度限流**：写操作 60 次/分钟，超限返回 `RATE_LIMITED`。\n\n### 2.3 统一错误码与返回格式\n所有云函数统一返回 `{ code, msg, data }`：\n\n| code | 含义 |\n|---|---|\n| `SUCCESS` | 成功 |\n| `UNAUTHORIZED` | 无法识别用户（无 OPENID） |\n| `FORBIDDEN` | 身份有效但无权访问该资源 |\n| `USER_NOT_FOUND` | openid 未建档 |\n| `RATE_LIMITED` | 触发限流 |\n| `INVALID_PARAM` | 参数校验失败 |\n\n### 2.4 基础表结构（**严格照做，表名/字段/类型不得改动**）\n\n**A 类 · 已锁定表**\n| 表名 | 用途 |\n|---|---|\n| `shop_material` | 原料档案（含半成品虚拟原料 `is_virtual`） |\n| `shop_cost_card` | 成本卡主表（**只 INSERT 不 UPDATE**） |\n| `shop_cost_card_line` | 成本卡明细行（**快照**） |\n| `shop_sandbox` | 选址盈利沙盘方案（M2） |\n| `shop_amortize` | 摊销资产台账 |\n| `audit_log` | 全局操作日志（**只 INSERT**） |\n\n**B 类 · 设计表（关键字段）**\n| 表名 | 关键字段 |\n|---|---|\n| `shop_monthly_account` | `id, shop_id, month(YYYY-MM), revenue_total(分), cost_total, expense_total, profit_ref, profit_true, gross_profit, gross_margin, is_archive, archived_at` |\n| `shop_monthly_income` | `id, shop_id, month, category, sub_item, amount(分), remark` |\n| `shop_monthly_expense` | `id, shop_id, month, category, sub_item, amount(分)` |\n| `shop_inventory` | `id, shop_id, month, begin_stock(分), purchase(分), end_stock(分), actual_consume(分,系统算)` |\n| `shop_stored_value` | `id, shop_id, month, recharge, consume, balance` |\n| `shop_credit_ledger` | `id, shop_id, date, type, amount(分), customer, is_settled` |\n| `subscription_plan` | `plan_id, name, price(分), days, type, enabled, sort` |\n| `feature_permissions` | `plan_id, feature_key, enabled` |\n| `shop_switch` | `shop_id, switch_key, enabled`（库存开关 / 摊销开关 / 收入开关） |\n| `shop_income_item` / `shop_expense_item` | `id, shop_id, item_key, item_name, category, sort_order, enabled, is_system` |\n| `shop_subscription` | `id, **user_id**, plan_id, start_at, expire_at, source(manual/payment), status`（**主体=用户**，非店铺） |\n| `shop_payment_flow` | `id, **user_id**, order_no, amount(分), plan_id, status, paid_at, channel, shop_id(可选,下单来源)` |\n\n**本版补充表**\n| 表名 | 关键字段 |\n|---|---|\n| `user` | `user_id(雪花主键), openid(唯一索引), unionid, nickname, avatar, created_at, is_deleted`（**权限主体**） |\n| `shop` | `id, user_id, name, remark, is_deleted, created_at`（**M1 账套按此表 is_deleted=false 计数**） |\n| `shop_entitlement` | **`user_id(唯一)`**, `expire_at(BIGINT UTC), source, updated_at`（**权限唯一依据**）⚠️ **不是 shop_id** |\n| `order_refund` | `id, order_id, user_id(权限主体), shop_id(业务关联), amount(分), refund_at, reason, operator` |\n| `admin_user` | `id, username(唯一), pwd_hash, salt, role, status, locked_until, last_login_at` |\n| `admin_login_log` | `id, admin_id, ip, result, created_at` |\n\n**通用字段（业务表均带）**：`created_at / updated_at (BIGINT 毫秒)`、`is_deleted (BOOL)`、`delete_at (BIGINT)`、`delete_by`。\n**类型铁律**：金额 **INT「分」**；百分比 `DECIMAL(5,2)`（35.00 表示 35%）；时间 **BIGINT 毫秒 / UTC**；年月 **YYYY-MM 字符串**。\n**索引**：`openid`(唯一)、`user_id`、`shop_id`、`expire_at`、`is_deleted`；复合 `(shop_id, month)`、`(shop_id, is_deleted)`。\n\n> 🔴 **主体维度铁律（易错，务必照做）**\n> **权限 / 订阅 / 订单的\"主体\"是 `user_id`，不是 `shop_id`** —— 对齐 v1.4 §7.7 原文：`shop_entitlement(user_id, expire_at, source)`。\n> - 用户付费 → 名下**所有店铺共享权限**，**不是**\"一店一权限、一店一付费\"。\n> - `shop_id` 仅在订单/退款里作为**业务关联来源**保留，**不参与任何权限判定**。\n> - 免费配额（M1 限 1 家店）仍按 `shop` 表 `is_deleted=false` **计数**，与权限主体无关。\n\n**`audit_log` 字段（地基阶段锁死，只 INSERT）**\n`id, action(如 ADMIN_GRANT_ENTITLEMENT / M3_CREATE_CARD), operator_type(user/admin), operator_id, shop_id(可选), before_data(JSON), after_data(JSON), remark, created_at`\n→ 保证所有操作**可追溯到人、可还原前后状态**。\n\n**幂等键维度**\n唯一键 = **`(shop_id + client_request_id)`**（不同店铺允许复用请求 ID，避免全局唯一导致误拦截）；**读操作不强制**，**所有写操作必须校验**。\n\n### 2.5 服务端时间工具\n- 统一 `nowUtc()` 返回服务端 UTC 毫秒；**禁止使用前端传入时间**。\n- 月份统一用 `YYYY-MM` 字符串；需要 Date 时用**月中固定时刻** `new Date(year, month, 15, 12, 0, 0)`（防时区/夏令时跳变）。\n\n### 2.6 软删过滤层\n- 数据访问层**统一注入** `is_deleted = false`，不依赖每个云函数手写。\n- 软删写 `is_deleted=true` + `delete_at` + `delete_by`；**软删数据不占免费配额**。\n\n### 2.7 通用工具\n金额元↔分转换、百分比计算、**尾差倒挤**工具、audit_log 写入工具（只 INSERT）。\n\n### 2.8 可运行建表脚本 + 配套规范（必做，防「集合不存在」）\n- **建库云函数 `initDb`**：把 §2.4 的 **25 张集合 + 索引 + 种子套餐/权限** 落地为可运行脚本 `prototype/init_db.js`，部署为云函数 `initDb`，**仅手动运行一次**（可重复跑，已存在则跳过）。**不建集合代码一跑就报「集合不存在」**。\n- **统一错误码表**（`core/09_统一错误码表.md`）：所有批次共用同一套码，**禁止各批自造**；前端按 `code` 从 `i18n/terms.js` 映射文案，禁硬编码。\n- **云函数清单与接口契约**（`core/10_云函数清单与接口契约.md`）：全部云函数名/入参/出参/归属批次/鉴权单一来源；前端与后端**按此表函数名对接**，不得自造函数名。\n\n### 2.9 前后端字段命名约定（snake_case ↔ camelCase 映射，写码防对接坑）\n- **数据库 / 云开发文档字段**：一律 `snake_case`（`expire_at`、`is_deleted`、`client_request_id`、`shop_id`）。\n- **云函数出入参（契约层）**：统一 `snake_case`（`expire_at`、`client_request_id`、`plan_id`、`card_code`），与数据库字段对齐，便于 DataAdapter 直转。\n- **前端 JS / WXML 绑定**：一律 `camelCase`（`expireAt`、`clientRequestId`、`planId`、`cardCode`）。\n- **转换唯一位置**：`snake_case ↔ camelCase` 的转换**只在 DataAdapter 层（后端）或前端请求适配层**做；**业务逻辑 / Service 层禁止混用两种命名**。\n- 本约定与 `core/10_云函数清单与接口契约.md` §8 为单一来源；任何字段若需改名，先改契约表 + 本批表结构清单。\n\n### 2.10 验收提效：种子数据 + 自检脚本（seed_demo，与 initDb 配套）\n\n> 写码完成各模块后，用本套脚本可「一键复现」《02_模拟测试数据集》S1~S4 的 22 项验收锚点，无需手动造数。\n\n- **三个文件（均在 `prototype/`）**：\n  - `seed_data.js`：**验收输入的单一真相源**。把 S1~S4 用四个计算原型（calcMonthlyProfit / calcDishCost / calcAmortize / calcSandbox）的输入形状结构化表达，并携带预期输出值。\n  - `verify_seed_data.js`：**本机自检脚本（无需云环境）**。把 `seed_data.js` 喂给四个计算原型，断言 22 项验收锚点 100% 命中（误差 ≤ 0.01 元）。**当前已本机跑通：48/48 全绿**。\n  - `seed_demo.js`：**云函数灌库脚本**。部署为云函数 `seedDemo`，在 initDb 之后手动调用一次，把同一份 `seed_data.js` 翻译为集合记录插入 dev 环境的 demo 测试店（shop_id=`shop_seed_demo`，与真实数据隔离；entitlement 解锁便于验收全额跑通）。\n- **运行顺序**：① 跑 `initDb`（建 25 集合+索引+套餐种子）→ ② 跑 `seedDemo`（灌 S1~S4 业务数据）→ ③ 前端/云函数按《02_模拟测试数据集》22 项清单逐项核对。\n- **详细规范**：`core/14_种子数据与验收脚本规范.md`（字段映射表、部署步骤、精度与隔离说明）。\n- **关键纪律**：① `seed_data.js` 是单一真相源，verify 与 seed_demo 都引用它，改验收数据只改这一处；② 循环引用拦截与成本卡刷新是「保存时/运行时」行为，不预置违规数据，验收时手动触发；③ 精度：金额一律分整数，verify 已对齐「先四舍五入至分再反推毛利/毛利率」的生产口径。\n\n### 2.11 前端环境配置 `config/env.js`（必须生成 · 复审节点①核对项）\n\n- 小程序端 `wx.cloud.init({ env })` **只允许从 `config/env.js` 取值**（core/06 §1.3.1 铁律）；**禁止**在业务代码硬编码环境 ID 字面量（如 `catering-dev` / `catering-prod`）。\n- `config/env.js` 必须导出 `ENV_MAP = { dev: '<真实环境ID>', prod: '<真实环境ID>' }`，其中 **`dev` / `prod` 填云开发控制台给出的真实环境 ID（形如 `catering-dev-xxxxxx` / `catering-prod-xxxxxx`）**，**严禁照抄规范示例里的短名 `catering-dev` / `catering-prod`**（短名是展示别名，`wx.cloud.init` 传别名可能解析不到真实环境，导致所有云调用失败）。\n- 真实环境 ID 在「建 dev / prod 双环境」后由控制台获取，填进 `config/env.js`；**云函数内一律用 `cloud.DYNAMIC_CURRENT_ENV`，不引用任何环境 ID 常量**（core/06 §1.3.1）。\n- 自测：切换 dev / prod 环境后前端能正确调用对应云环境；`config/env.js` 中无短名 `catering-dev` / `catering-prod` 裸写。\n\n## 3. 强制遵守（已拍板规范）\n- **01 铁律 1**：金额统一分（INT）、重量克、时间 Unix 毫秒、月份 YYYY-MM\n- **01 铁律 3**：所有查询强制带 `shop_id`\n- **01 铁律 7**：**配置读表，禁硬编码**（价格、限额、套餐名）\n- **01 铁律 8**：必留痕（audit_log 只 INSERT）\n- **06 §6.1**：写操作必带 `client_request_id` 幂等（唯一键 = `shop_id + client_request_id`）\n- **分层约束**：**所有数据库操作必须走 DataAdapter 层**，禁止 Controller / Service 直连数据库（保证软删过滤、统一字段注入全局生效）\n- **v1.4 §7.7**：权限判定**只读 `shop_entitlement.expire_at`**，不读 plan_id；**权限主体为 `user_id`**（用户付费 → 名下所有店铺共享权限）\n- **v1.4 §10.3**：有效期以**服务端 UTC** 为准，禁前端本地时间\n- **v1.4 §10.5**：软删不占配额\n\n## 4. ✅ 明确禁止（地基纯净的关键，逐条写死）\n- ❌ 禁止写入任何 **M1 / M2 / M3 业务计算逻辑**（不做利润、摊销、BOM、成本卡任何算法）\n- ❌ 禁止硬编码任何**价格、套餐名、功能文案**（一律读表 / 读 i18n）\n- ❌ 禁止**跳过鉴权中间件**直接编写业务接口\n- ❌ 禁止**自定义时间计算逻辑**，必须统一调用服务端 UTC 工具函数\n- ❌ 禁止创建**本批表结构清单以外**的任何表\n- ❌ 禁止给前端返回任何**非当前用户权限内**的数据\n- ❌ 禁止做前端页面（本批只有云函数与数据层）\n- ❌ 禁止接入支付（当前 `enable_real_payment=false`）\n- ❌ 禁止实现**管理端鉴权**逻辑 —— 本批**仅做用户端微信 openid 鉴权**；管理端独立账号鉴权在**批次 6** 实现（防止混入用户端中间件、打破权限隔离）\n\n## 5. 验收标准（可量化，逐条对照）\n1. 篡改请求里的 `user_id` → 返回 `FORBIDDEN`，拿不到他人店铺数据\n2. 同一 `client_request_id` 在同一店铺连发两次写请求 → 只产生一条数据（幂等生效）；**换一个店铺用同一 ID 不被误拦截**（幂等键含 shop_id）\n3. 1 分钟内第 61 次写请求 → 返回 `RATE_LIMITED`\n4. 前端传入任意本地时间 → 服务端不采信，全部走 UTC 工具\n5. **建表结果：表名与字段与本批清单 100% 一致**（不多表、不改名、不改类型）\n6. 查询默认过滤 `is_deleted=false`，软删数据不出现在结果中\n7. 🔴 **主体维度正确**：`shop_entitlement` 以 **`user_id` 唯一**（不是 shop_id）；给一个用户发权益后，其名下**所有店铺**均按付费档判定；`shop_id` 不参与权限判定\n8. `audit_log` 一条记录能同时看到 `operator_type/operator_id/before_data/after_data`，可还原前后状态\n\n## 输出要求\n先给建表结构（集合名+字段+索引），再给鉴权中间件与工具函数代码，最后附**自测结果表**（预期/实际/是否通过）。"}, {"n": 1, "label": "批次 1 · POC3 双利润引擎算法（12 锚点）", "text": "# 批次 1 / 8 · POC3 双利润引擎算法（云函数）\n\n## 1. 批次定位\n第 1 批，基于批次 0 的地基（已自带鉴权/错误码/时间工具）开发**业务算法**。\n**核心目标**：实现月度双利润计算引擎。这是 **M1 付费墙的核心价值支柱**——算飞了，付费用户拿到的\"真实利润\"不准，整个付费逻辑就塌了。\n\n## 2. 完整需求\n\n实现一个云函数 `calcMonthlyProfit(input)`：\n\n```\ncalcMonthlyProfit(input) → {\n  营业收入, 食材成本, 菜品毛利, 毛利率,\n  经营参考利润, 全要素真实利润, 两利润差异\n}\n```\n\n**摊销金额本次由外部传入一个数**（摊销算法在第 2 批，本批不实现）。\n\n### 开关来源（防前端篡改）\n- ⚠️ **库存开关、摊销开关的状态，优先从 `shop_switch` 表读取（服务端权威），前端传入的值仅作参考**。最终计算口径以服务端读取的开关为准，避免前端篡改开关绕过计算逻辑（例如关掉库存开关让倒轧值失效）。\n\n### 规则\n1. **毛利铁律**：`菜品毛利 = 营业收入 − 食材成本`。食材成本**只含食材耗材**；房租/人工/水电属于**费用**，不算进营业成本。\n2. **食材消耗两种取数**：库存关闭→直接取用户填的总消耗；库存开启→倒轧 `真实消耗 = 期初存货 + 本期采购 − 期末盘点`。\n3. **两个利润口径**：\n   - 🟢 `经营参考利润 = 营业收入 − 总费用 − 【直接填的总消耗】`（不含摊销）\n   - 🔵 `全要素真实利润 = 营业收入 − 总费用 − 【真实消耗】 − 当月摊销总费用`\n   - `两利润差异 = (真实消耗 − 直接填消耗) + 当月摊销`\n4. **⚠️ 口径锁（本批核心考点）**：**即使开启库存开关，「经营参考利润」仍必须使用「直接填的总消耗」，不能改用倒轧值**。只有「全要素真实利润」才用倒轧值。这是**刻意设计，不是 bug，不要\"修正\"它**。\n5. **待结算不进利润**：外卖/团购待结算金额是现金流指标，绝不进入毛利或利润。\n\n### 测试数据\n\n**场景 S1（库存关、摊销关，2026-07）**\n- 收入：堂食现金 8,000 / 堂食微信支付宝 25,000 / 堂食储值消费 5,000 / 堂食团购券核销 3,000 / 堂食企业挂账 2,000（**堂食合计 43,000**）；外卖商品总价 18,000 / 外卖打包费 500 / 外卖商家活动补贴 1,500（**外卖合计 20,000**）；其他业务收入 1,000 → **收入合计 64,000**\n- 成本（库存关，直接填）：当月食材耗材总消耗 = **22,000**\n- 费用：门店运营费 10,300（房租8,000/物业500/水200/电800/燃气600/垃圾100/宽带100）／人工总成本 15,000（工资12,000/社保1,500/宿舍800/员工餐500/工装200）／营销推广费 7,240（外卖佣金3,600/配送费1,200/活动补贴1,500/配送补贴300/推广费400/团购佣金240）／其他支出 300 → **费用合计 32,840**\n\n**场景 S2（库存开、摊销开，2026-08）**\n- 收入与费用同 S1（收入 64,000，费用 32,840，不含摊销）\n- 库存：期初 5,000 / 采购 25,000 / 期末 7,000 → **真实消耗 23,000**\n- 当月摊销总费用（外部传入）= **4,683.33**\n- ⚠️ 老板直接填的总消耗**仍是 22,000**（与 S1 相同）\n\n**场景 2-R（连锁重算，期初结转）**\n- S2 基础上，2026-07 期末盘点 5,000 → 3,000，则 2026-08 期初 3,000 → 真实消耗 = 3,000+25,000−7,000 = **21,000**\n- ⚠️ 此处\"连锁\"=**期初结转**（单店跨月），**不是多门店/连锁分摊**，本批无多店逻辑\n\n## 3. 强制遵守\n- 金额一律**分（INT）**计算，展示 ÷100；禁止浮点存金额\n- 本批云函数**必须过批次 0 的鉴权中间件**，带 `shop_id` 归属校验\n- 所有写操作带 `client_request_id` 幂等\n- 时间一律走服务端 UTC 工具\n- **计算精度（对齐 POC2 口径 B）**：中间计算过程保留高精度，**最终输出金额统一 round 到分整数**；毛利率保留 2 位小数（如 65.625% → 输出 65.63% 展示；验收锚点误差 ≤0.01 元，65.625% 与 65.63% 视为同口径）。\n- **分层归属**：`calcMonthlyProfit` 是 **Service 层纯计算函数**，不直接接触数据库与前端请求；Controller 层调用前**必须先过鉴权中间件 + 参数校验**，再把干净数据传入 Service。\n\n## 4. ✅ 明确禁止\n- ❌ 不做前端页面、不做数据库写入（本批只验证算法）\n- ❌ 不实现摊销算法（摊销由外部传入）\n- ❌ 不把房租/人工/水电算进食材成本\n- ❌ **开库存后把经营参考利润改用倒轧值**（违反口径锁）\n- ❌ 不把待结算金额算进利润\n- ❌ 不让收入合计/费用合计可以被手动编辑（必须系统汇总）\n- ❌ 不做多门店/连锁分摊逻辑\n\n## 5. 验收标准（12 条锚点，误差 ≤ 0.01 元全中）\n\n| # | 场景 | 指标 | 预期 |\n|---|---|---|---|\n| 1 | S1 | 收入合计 | **64,000** |\n| 2 | S1 | 费用合计 | **32,840** |\n| 3 | S1 | 菜品毛利 | **42,000** |\n| 4 | S1 | 菜品毛利率 | **65.625%** |\n| 5 | S1 | 🟢 经营参考利润 | **9,160** |\n| 6 | S1 | 🔵 全要素真实利润 | **9,160** |\n| 7 | S2 | 本期真实消耗 | **23,000** |\n| 8 | S2 | 🟢 经营参考利润 | **9,160**（用 22,000，不是 23,000） |\n| 9 | S2 | 🔵 全要素真实利润 | **3,476.67** |\n| 10 | S2 | 两利润差异 | **5,683.33** |\n| 11 | 2-R | 本期真实消耗 | **21,000** |\n| 12 | 2-R | 🔵 全要素真实利润 | **5,476.67** |\n\n> ❌ 若 S2 经营参考算出 **8,160**（用了倒轧 23,000）= **违反口径锁**，必须改回 9,160。\n\n## 输出要求\n先给代码，再给自测结果表（预期/实际/是否通过），并**单独用一段话说明你如何实现\"口径锁\"**。"}, {"n": 2, "label": "批次 2 · POC1 摊销边界与尾差残值（4 锚点）", "text": "# 批次 2 / 8 · POC1 摊销边界与尾差残值（云函数）\n\n## 1. 批次定位\n第 2 批，基于批次 0 地基。**核心目标**：实现摊销计算，为批次 1 的\"当月摊销总费用\"提供数据来源。摊销末月尾差是**最高频算错点**。\n\n## 2. 完整需求\n实现 `calcAmortize(asset, target_month)`，规则如下：\n\n1. **月摊销额 = `round(原值 ÷ 总月数, 2)`**（四舍五入到分）\n2. **末月摊销额 = `原值 − 前(N−1)期合计`** —— **尾差倒挤**，保证 N 期总和严格等于原值\n3. **实际摊销区间 = `[摊销开始月, 截止月]`，两端都含**\n   - 截止月 = 若设了「终止年月」且早于自然到期 → 取终止年月；否则 = `摊销开始月 + 总月数 − 1`\n4. **四条推论**：① 摊销开始**当月即摊** ② 终止**当月仍摊** ③ 到期**当月仍摊** ④ **次月起停止**\n5. **提前终止**：未摊余额 = `原值 − 已摊合计`，作为「资产处置/报废损失」一次性计入当期，**不继续摊**\n6. 区间外的月份摊销额 = **0**\n7. **多资产并行**：每个资产**独立计算末月尾差倒挤**，**不得多个资产合并后统一算总尾差**；三资产合计 = 各资产当月摊销额相加（对齐验收锚点 4,683.33）。\n8. **软删除资产默认排除**：`is_deleted=true` 的摊销资产不参与计算，由 DataAdapter 层统一过滤，业务层无需单独处理。\n\n### 测试数据\n\n**用例 A · 边界验证**\n| 资产 | 原值 | 摊销开始 | 总月数 | 终止年月 |\n|---|---|---|---|---|\n| 旧空调 | 12,000 | 2026-01 | 36 | **2026-08**（提前报废） |\n| 招牌制作 | 6,000 | 2026-01 | 12 | 不填（自然到期） |\n\n**用例 B · 多资产并行 + 尾差倒挤**\n| 资产 | 原值 | 摊销开始 | 总月数 |\n|---|---|---|---|\n| 装修 | 120,000 | 2026-01 | 36 |\n| 加盟费 | 30,000 | 2026-03 | 24 |\n| 冰柜 | 6,000 | 2026-06 | 60 |\n\n## 3. 强制遵守\n- 金额一律**分（INT）**，末月尾差倒挤到分\n- 年月用 `YYYY-MM` 字符串，区间**含两端**\n- 云函数必须过批次 0 鉴权中间件，带 `shop_id`\n- 写入 `shop_amortize` 表\n- **分层归属**：`calcAmortize` 是 **Service 层纯计算函数**，不直接接触数据库与前端请求；Controller 层调用前**必须先过鉴权中间件 + 参数校验**，再把干净数据传入 Service。\n- **时间工具复用**：月份区间计算、月份增减**统一调用批次 0 的时间工具函数**，**禁止自定义月份计算逻辑**，确保时区、格式、月中基准时刻全局一致。\n- **输出对接批次 1**：函数返回结构包含 `total_amount_fen`（当月摊销总费用，分整数）+ `details`（各资产摊销明细）；数值格式与批次 1 `calcMonthlyProfit` 的「当月摊销总费用」输入**完全对齐，可直接传入**。\n\n## 4. ✅ 明确禁止\n- ❌ 不做前端页面\n- ❌ **不做尾差倒挤**（末月直接沿用月摊额）——这是最高频错误\n- ❌ 不把终止/到期当月排除在外（必须含两端）\n- ❌ 不把已报废资产继续摊销\n- ❌ 不实现双利润计算（那是批次 1）\n\n## 5. 验收标准（4 条锚点，误差 ≤ 0.01）\n\n| 数字 | 应为 | 错了说明什么 |\n|---|---|---|\n| 旧空调残值（2026-08 报废） | **9,333.36** | 终止区间算错（多摊/少摊期数） |\n| 招牌已摊合计 | **6,000.00** | 尾差没吸收，总和不等于原值 |\n| 2026-08 三资产合计 | **4,683.33** | 并行计算或\"开始当月即摊\"判断错 |\n| 装修末月（2028-12） | **3,333.45** | ❌ 若输出 3,333.33 = **没做尾差倒挤** |\n\n**手算核对**：\n- 旧空调：月摊 = 12,000÷36 = 333.33；摊 8 期（01~08），已摊 2,666.64；残值 = 12,000−2,666.64 = **9,333.36**\n- 装修第 36 期 = 120,000 − 3,333.33×35 = **3,333.45**（⚠️ 是 .45 不是 .33）\n\n## 输出要求\n先给代码，再给自测结果表，并说明**尾差倒挤**在哪一段实现。"}, {"n": 3, "label": "批次 3 · POC2 BOM 两层+循环拦截+成本快照（16 锚点）", "text": "# 批次 3 / 8 · POC2 BOM 两层嵌套、循环拦截与成本快照（云函数）\n\n## 1. 批次定位\n第 3 批，基于批次 0 地基。**核心目标**：菜品成本卡算法（BOM 两层 + 循环引用拦截 + 快照版本）。历史最高频算错点：辅料损耗口径。\n\n## 2. 完整需求\n\n### 2.1 原料档案（先按此录入）\n| 原料 | 采购单位 | 单价(元) | 换算系数(→g) | 出成率% | 净料单位成本(元/g) |\n|---|---|---|---|---|---|\n| 鸡胸肉 | 斤 | 15 | 500 | 90 | 0.0333 |\n| 花生米 | 斤 | 10 | 500 | 100 | 0.020 |\n| 干辣椒 | 斤 | 20 | 500 | 100 | 0.040 |\n| 葱姜蒜 | 斤 | 5 | 500 | 100 | 0.010 |\n| 调料油 | 斤 | 10 | 500 | 100 | 0.020 |\n| 牛油 | 斤 | 20 | 500 | 100 | 0.040 |\n| 花椒 | 斤 | 40 | 500 | 100 | 0.080 |\n| 豆瓣酱 | 斤 | 8 | 500 | 100 | 0.016 |\n| 香料 | 斤 | 60 | 500 | 100 | 0.120 |\n| 时蔬拼盘 | 斤 | 3 | 500 | 100 | 0.006 |\n| 肉丸 | 斤 | 20 | 500 | 100 | 0.040 |\n\n### 2.2 公式\n```\n采购每克成本 = 采购单价 ÷ 换算系数（换算到 g）\n净料单位成本 = 采购每克成本 ÷ (出成率 ÷ 100)\n\n明细净料成本合计 = Σ(每行用量 × 该行净料单位成本快照)\n单品原材料总成本 = (明细净料成本合计 + 辅料综合分摊成本) ÷ (1 − 制作损耗率 ÷ 100)\n```\n> ⚠️ **建模假设（不得\"优化\"）**：辅料与原料**一并**按 `(1 − 制作损耗率)` 放大。若把辅料排除，宫保会从 9.75 变 **9.73** —— 那就是错的。\n\n**批量（模式 B）**：\n```\n整批总成本 = (整批明细净料成本合计 + 辅料) ÷ (1 − 制作损耗率 ÷ 100)\n单份半成品成本 = 整批总成本 ÷ 本批次总产出份数\n```\n保存后**自动生成虚拟原料**：`is_virtual=true`，单位=份，换算系数=1，存的是「每份成本」。\n\n### 2.3 用例\n- **A · 宫保鸡丁**（单份，第0层）：损耗率 5%，辅料 0.50 元/份，售价 28 元。明细：鸡胸肉 200g(6.66) / 花生米 50g(1.00) / 干辣椒 10g(0.40) / 葱姜蒜 30g(0.30) / 调料油 20g(0.40) → 明细合计 **8.76**\n- **B · 红油底料**（批量，第1层）：产出 10 份，损耗率 0%，辅料 2.00 元（整批）。牛油500g(20.00)/干辣椒200g(8.00)/花椒50g(4.00)/豆瓣酱300g(4.80)/香料50g(6.00) → 原料合计 **42.80**\n- **C · 麻辣香锅**（引用半成品，第2层）：损耗率 3%，辅料 0.50 元/份，售价 38 元。红油底料 1份(4.48) / 时蔬拼盘 500g(3.00) / 肉丸 100g(4.00) → 明细合计 **11.48**\n- **D · 循环引用拦截**：半成品 A 引用 B，再让 B 引用 A → 保存 B 时检测循环，抛 `BOM_CYCLE_DETECTED`，**数据不入库**\n- **E · 快照与手动刷新**：保存后改原料价，旧卡成本**不变**；点「同步至原料最新价格」生成**新版本**，旧版本仍可查\n\n### 2.4 写入表、版本与快照说明（对齐第 8 章锁定表与全局规则）\n- **存储表（表名/字段必须与第 8 章清单 100% 一致，不得改名/改类型）**：\n  - 计算结果写入 `shop_cost_card`（成本卡主表，**只 INSERT 不 UPDATE**）、`shop_cost_card_line`（成本卡明细行，**存净料单位成本快照**）；\n  - 批量模式自动生成的虚拟原料写入 `shop_material` 表，标记 `is_virtual=true`（单位=份，换算系数=1，存「每份成本」）。\n- **快照字段语义（快照隔离的核心，不得简化）**：成本卡明细行必须**完整存储当时的净料单位成本快照值**，不得仅存储原料 ID 做关联查询——这是快照隔离的本质，保证原料价格后续变动不影响历史成本卡。\n- **成本卡版本规则**：每次「同步至原料最新价格」生成新版本时，版本号按自然数递增（v1 → v2 → v3…）；同一成本卡的所有历史版本通过 `card_code` 字段关联，查询默认返回最新版本，旧版本仍可通过版本历史查看。\n\n### 2.5 云函数命名约定（锁死，前端批次 4 按此调用）\n\n本批生成的所有云函数**必须**使用以下名称（无 `m3` 前缀；与 `10_云函数清单与接口契约.md` §3 完全一致），前端（批次 4 的 M3 页面）按此名 `callFunction`：\n\n| 函数名 | 用途 |\n|---|---|\n| `getMaterial` | 原料档案（含虚拟半成品） |\n| `saveMaterial` | 新增/编辑原料（改价不影响旧卡） |\n| `getCostCard` | 成本卡列表/详情（最新版本） |\n| `saveCostCard` | 保存成本卡（只 INSERT 新版本） |\n| `syncCostCard` | 同步原料最新价→生成新版本 |\n| `calcBom` | **纯计算**（Service 层，POC2 锚点） |\n| `detectCycle` | 循环引用检测（DFS 深度≤5） |\n\n## 3. 强制遵守\n- 金额**分（INT）**；中间计算保高精度，**总成本 round 到整数分**（口径 B：中间保精度，最终 round 到分）\n- **成本卡只 INSERT 不 UPDATE**（改 = 另存新版本）；版本号自然数递增，经 `card_code` 关联历史版本\n- **BOM 限 2 层**，循环引用必须拦截；循环检测采用**递归深度优先遍历，最大深度限制 5 层**，检测到依赖环立即抛 `BOM_CYCLE_DETECTED`、终止保存、**数据不入库**（2 层为业务上限，5 层检测做冗余兜底）\n- 云函数过批次 0 鉴权，带 `shop_id`\n- **分层归属**：核心计算函数为 **Service 层纯逻辑**，不直接接触数据库与前端请求；Controller 层调用前**必须先过批次 0 鉴权中间件 + 参数校验 + `shop_id` 归属校验**，再把干净数据传入 Service\n- **软删除默认过滤**：已软删除（`is_deleted=true`）的原料、成本卡**默认不参与计算与查询**，由 DataAdapter 层统一注入过滤条件，业务层无需单独处理\n\n## 4. ✅ 明确禁止\n- ❌ 不做前端页面\n- ❌ 不把辅料排除在损耗放大之外（会得到 9.73，错误）\n- ❌ 不做自动联动更新（必须手动同步才生成新版本）\n- ❌ 不用 UPDATE 覆盖历史版本\n- ❌ 不在成本卡明细行仅存原料 ID 关联查询（必须完整存储当时净料单位成本**快照值**，原料价后续变动不得影响历史卡）\n- ❌ 不实现双利润/摊销（批次 1/2 已做）\n\n## 5. 验收标准（16 条锚点，误差 ≤ 0.01）\n\n| 数字 | 应为 |\n|---|---|\n| 宫保鸡丁总成本 | **9.75**（⚠️ 口径 B 已锁定：中间保精度、最终 round 到分） |\n| 单品毛利（28−成本） | **18.25** |\n| 单品毛利率 | **65.18%**（基于存储值 9.75 推导） |\n| 反算售价（目标毛利 60%） | **24.38**（9.75 ÷ 0.4） |\n| 红油底料单份 | **4.48** |\n| 麻辣香锅总成本 | **12.35** |\n| 同步后新版本（鸡胸肉 15→20） | **12.08** |\n| A→B→A 循环 | **`BOM_CYCLE_DETECTED`**，数据不入库 |\n| 改原料价后旧卡 | **仍为 9.75**（快照隔离） |\n\n> ⚠️ **9.73 是错误值**（辅料未随损耗放大的 bug）。若你算出 9.73，说明辅料口径错了，**直接判定不通过**。\n\n## 输出要求\n先给代码，再给自测结果表，并说明循环引用检测与快照隔离分别在哪实现。"}, {"n": 4, "label": "批次 4 · M1/M2/M3 页面闭环 + 店铺设置", "text": "# 批次 4 / 8 · M1 / M2 / M3 页面闭环 + 店铺设置\n\n## 1. 批次定位\n第 4 批，对接批次 0~3 的后端能力。**核心目标**：把算法变成\"能用的产品\"——跑通「数据能录进去 → 算法能计算 → 结果能展示」完整闭环。**没有页面，前 3 批的算法无法被真实使用。**\n\n## 2. 完整需求\n\n### 2.1 M1 月度经营页面清单\n| # | 页面 | 说明 |\n|---|---|---|\n| 1 | 月度经营首页 | 月份选择器 + 双口径 tab + 结果卡 |\n| 2 | **双口径切换 UI** | 免费 **「经营参考估算」** / 付费 **「真实利润」**；付费 tab 为锁定态，点击触发付费弹窗 |\n| 3 | 收入录入页 | 堂食/外卖/其他，按 `shop_income_item` 配置化 |\n| 4 | 费用录入页 | 四大类，按 `shop_expense_item` 配置化 |\n| 5 | 食材消耗录入页 | 库存关→直接填总额；库存开→跳库存录入 |\n| 6 | **库存录入页** | 期初 / 采购 / 期末盘点（`shop_inventory`） |\n| 7 | **摊销资产管理页** | 新增/编辑/报废（原值/开始月/总月数/终止月）+ 当月摊销合计（`shop_amortize`） |\n| 8 | 结果展示页 | 收入/费用/毛利/毛利率/双利润/差异 |\n| 9 | **历史月份切换** | 月份切换查看往期；归档月 `is_archive=true` **禁改** |\n| 10 | **店铺设置页** | ~~库存开关 / 摊销开关~~ / 店铺名称与备注（写 `shop_switch`）⚠️ **2026-09-20 更正**：库存 / 摊销开关已迁出本页，改到**「月度录入」页「这两笔钱怎么算」就地二选一**（真机走查：老板在设置页看不懂\"库存核算/摊销核算\"）。写库仍是 `shop_switch`，服务端契约**一字未改**，变的只是 UI 落点。 |\n\n### 2.2 M3 成本卡\n成本卡列表 / 新建卡（原料+用量）/ 批量模式 / **版本历史查看** / 反算售价。\n页面常驻提示：理论配方成本 ≠ 真实门店毛利。\n\n### 2.3 M2 开店测算\n输入页 + 结果页。**v1.0 仅做正算**（不做反推，反推排 v1.1）。结论前置语：「按你填的数，这家店每月大概能剩 ¥____」。\n\n### 2.3.1 M2 计算引擎（必须调云函数 · 前端不计算 · 锚点见 POC4/S4）\nM2 为正算沙盘，公式与验收锚点已锁定，前端**仅展示后端返回值**，绝不自行编公式：\n- 综合变动成本率 = 菜品% + 营销% + 其他%\n- 边际贡献率 = 1 − 综合变动成本率\n- 固定成本合计 = 月房租 + 物业费 + 固定人工合计 + 其他固定杂费 +（含模拟摊销时叠加「模拟月摊销额」）\n- 保本月营业额 = 固定成本合计 ÷ 边际贡献率\n- 保本日均 = 保本月营业额 ÷ 30（**固定÷30**，不按当月实际天数）\n- 目标利润月营收 = (固定成本合计 + 目标月利润) ÷ 边际贡献率\n- 目标利润日均 = 目标利润月营收 ÷ 30\n- **红警（唯一强制指标）**：综合变动成本率 **≥ 100%** → 提示「当前结构无法盈利」，**不计算负数保本**\n- **计算下沉**：全部 **Service 层计算**，Controller 只展示；金额分整数、除法四舍五入至分（同 M1/M3 红线）\n- **验收锚点（S4，已本机跑绿 `prototype/calcM2.js` + `test_poc4.js`，14/14 ✅）**：固定合计 **21,300** / 变动率 **45%** / 边际贡献 **55%** / 保本 **38,727.27** / 保本日均 **1,290.91** / 目标月营收 **66,000** / 目标日均 **2,200**；红警用例：变动率 105% → 保本/目标为 null。前端展示值须经 Service 重算校验，防篡改。\n\n### 2.4 文案铁律\n**所有标题/按钮/弹窗一律从 `i18n/terms.js` 取词，禁止硬编码在 wxml**。\n当前文案基线：模块名「月度经营 / 开店测算 / 成本卡」；双口径「经营参考估算 / 真实利润」；付费按钮「开通真实利润」（**必须带功能名**，禁「开通会员/立即订阅」）；免费页提示「当前为经营参考估算（按你直接填的消耗）。开通真实利润，可用库存倒轧算真实消耗，结果更准。」\n\n### 2.5 多端适配（必过）\n必须满足 **AD-1~AD-26**（详见核对清单第 F 章），重点：深色模式、大字体、字号≥28rpx/按钮≥88rpx、**键盘遮挡适配**（`adjust-position`）、iOS 小数键盘收起、**iOS 侧滑返回提示保存草稿**、输入防抖 300ms、弱网缓存、统一原生下拉刷新。⚠️ **双端真机验证底线**：所有页面必须通过 **iOS、安卓真机**验证，禁止仅用模拟器调试；重点验证键盘遮挡、小数键盘弹出、侧滑返回、深色模式四大项。\n\n### 2.6 页面级交互边界（对齐工程规范与后端口径锁）\n- **付费弹窗触发边界（防误弹）**：仅在「保存数量超限、导出操作」两类场景触发；进入页面、录入数据、试算、查看历史**均不触发**；**M2 模块永不触发**付费弹窗。\n- **归档月逻辑（触发双轨 + 7 天宽限补录）**：① **主触发=用户手动「结账归档」**（确认某月数据无误后主动归档，标记 `is_archive=true`）；② **辅触发=次月 1 日起软提示**——上月未归档在月份列表标「待归档」徽标（**不强制锁**，仍可编辑、不阻断录入）。归档月默认**禁止编辑/删除，仅可查看**；允许在**归档后 7 天内补录**（需二次确认，保存后重算），超过 7 天**硬锁**（仅查看/导出，修改须走客服后台）。切换历史月份时前端自动校验归档状态与宽限期，禁用越权编辑入口。\n- **店铺开关服务端优先**：库存/摊销开关状态以服务端 `shop_switch` 表读取值为准，前端仅同步展示；开关变更后的计算逻辑由后端控制，前端**不自行切换计算口径**。\n- **软删除页面表现对齐**：已软删除（`is_deleted=true`）的成本卡、摊销资产、店铺**默认不展示在列表**；删除操作前端**二次确认**，软删后数据不占用免费配额。\n- **表单校验与错误提示统一**：所有输入项前端做基础格式校验（金额非负、日期格式合法、必填项非空）；错误提示**统一映射后端标准错误码**，禁止自定义错误文案。\n\n## 3. 强制遵守\n- **计算下沉**：前端不做任何金额/利润计算，一律调云函数，展示后端返回值\n- **01 铁律 3**：所有请求带 `shop_id`\n- 文案全部读 `i18n/terms.js`\n- 付费弹窗**仅两类触发**：保存数量超限、导出操作；进入页面/录入/试算/查看历史**不触发**，**M2 永不触发**（详见批次 5）\n- **归档月 `is_archive=true` 全字段只读**，前端自动禁用编辑入口\n- **店铺开关以服务端 `shop_switch` 为准**，前端仅展示、不自行切换计算口径\n- **软删数据列表默认隐藏**，删除须二次确认、不占免费配额\n- **表单校验统一映射后端错误码**，禁止自定义错误文案\n- **表单金额必须先转「分」整数再传**：`input` 原生值是字符串、界面单位是「元」，前端适配层须 `Math.round(元 × 100)` 转成整数「分」的 **number** 再传（22,000 元 → `2200000`）；**禁止**把字符串金额直接透传 —— 云函数对非 number 一律返回 `INVALID_PARAM`（刻意设计，勿绕过）\n- **多端须 iOS+安卓真机验证**，禁止仅模拟器调试\n- **M2 严格按 M2.5 公式 + S4 锚点实现**（保本 38,727.27 / 目标 66,000 / 日均÷30 / 红警≥100%），前端不重算、不编公式，调云函数 `calcSandbox`；展示值须经 Service 重算校验防篡改\n\n## 4. ✅ 明确禁止\n- ❌ **不在前端计算任何利润/成本/毛利率**（一律调云函数）\n- ❌ 不把文案硬编码进 wxml/wxss\n- ❌ 不做反推功能（M2 仅正算）\n- ❌ 不自定义下拉刷新动画（统一原生 `pull-down-refresh`）\n- ❌ 不让归档月（`is_archive=true`）可编辑\n- ❌ 不在进入页面/录入/试算/查看历史时触发付费弹窗；❌ **不给 M2 弹任何付费窗**\n- ❌ 不让归档月可编辑或删除\n- ❌ 不按前端开关状态自行切换计算口径（必须服务端口径）\n- ❌ 不把软删数据展示在列表（应默认隐藏）\n- ❌ 不用自定义错误文案（须映射后端标准错误码）\n- ❌ 仅用模拟器验证（必须 iOS+安卓真机）\n- ❌ 不实现支付（批次 5 做）\n- ❌ 不做管理后台（批次 6 做）\n\n## 5. 验收标准\n1. 能新建店铺 → 录入收入/费用/食材消耗 → 算出结果与批次 1 的 S1 锚点一致（经营参考 9,160）\n2. 开启库存开关 → 能录期初/采购/期末 → 全要素真实利润 = **3,476.67**（经营参考仍 9,160 = 口径锁守住）\n3. 新增摊销资产 → 末月摊销 = **3,333.45**（尾差倒挤）\n4. 新建成本卡（宫保鸡丁）→ 总成本 **9.75**；改原料价后旧卡仍 9.75\n5. 切换历史月份可查看往期，归档月不可编辑\n6. ~~店铺设置里~~ **（2026-09-20 更正：在「月度录入」页「这两笔钱怎么算」里）**切换库存/摊销开关，对应模块可见性随之变化\n7. 页面上**搜不到**任何硬编码文案（全走 i18n）\n\n## 输出要求\n按页面逐个给代码（wxml/js/wxss 关键片段即可），最后给自测结果表。"}, {"n": 5, "label": "批次 5 · 付费全流程（弹窗触发+订单+续费+提醒+iOS降级）", "text": "# 批次 5 / 8 · 付费全流程（弹窗触发 + 订单 + 续费 + 提醒 + 失败处理 + iOS 降级）\n\n## 1. 批次定位\n第 5 批，把付费从\"一个弹窗\"变成\"完整闭环\"。**核心目标**：让用户付了钱知道成没成、在哪看有效期、到期怎么续。\n\n## 2. 完整需求\n\n### 2.1 付费弹窗触发规则（**仅两类**）\n| 动作 | 是否触发 |\n|---|---|\n| **保存超限**（M1 第 2 家店 / M3 第 4 张卡，即超出 3 张免费） | ✅ 触发 |\n| **导出动作**（任何导出/打印） | ✅ 触发 |\n| 进入页面 / 录入 / 修改 / 试算（点「算一算」） | ❌ **不触发** |\n| **M2 开店测算** | ❌ **永不弹窗**（永久免费） |\n\n> ⚠️ 做成\"进入页面就弹\"会严重伤害体验，**禁止**。\n\n### 2.1.1 免费配额维度铁律（前后端统一，禁止各算各的）\n- **维度 = `user_id`（全店通用，非按店铺）**：免费配额跟着用户走，跨该用户所有店铺共享。\n- **具体额度**：M1 = 每用户 **1 家免费账套**（第 2 家店触发）；M3 = 每用户 **3 张免费成本卡**（第 4 张触发）；M2 = **永久全免费、方案不限套、永不弹付费窗**（任何路径不得出现\"3 套\"配额或升级提示）。\n- **计数口径**：仅统计 `is_deleted=false`（软删数据不占额，由 DataAdapter 统一过滤）；切换店铺、查看历史**不触发**弹窗，仅\"保存超限 / 导出\"触发。\n- **与硬上限区分**：免费额度（1/3/3）是付费墙阈值；系统另有**硬上限**（M1 账套 200 / M3 卡 2000，见工程落地补全规范 §8）是防滥用总闸，付费用户也不得超过。两者不可混淆。\n\n### 2.2 弹窗文案（严格照此）\n- 保存超限：标题「已达免费上限」，正文「免费版可建 1 家店铺 / 3 张成本卡。开通真实利润后不限数量，还能用库存倒轧算真实消耗，结果更准。」主按钮「**开通真实利润**」，次按钮「再想想」\n- 导出：标题「导出需开通」，正文「开通真实利润后可导出 / 打印成本卡与经营报表。」主按钮「**开通真实利润**」，次按钮「取消」\n- ❌ 禁用词：付费 / 订阅 / 会员 / 立即订阅\n\n### 2.3 全流程环节\n1. **支付成功**：明示「已开通，有效期至 YYYY-MM-DD」\n2. **支付失败/取消**：友好提示 + **可重试**，不得静默失败或卡 loading\n3. **订单记录页**：订单号/套餐/金额/支付方式/状态/生效期\n4. **续费入口**：到期前 30 天内、到期后均可见；续费**有效期累加**\n5. **到期前提醒**：到期前 **7 天**采用「**小程序订阅消息 + 结果页常驻提示条**」**双渠道**；订阅消息需用户主动授权（不授权也不影响常驻提示条兜底）\n6. **到期后**：权限回落免费档，历史数据**永久保留、可看可编辑**，仅禁止新建与导出；**续费成功后立即恢复全部权限，有效期累加计算**\n\n### 2.4 权限判定（解耦铁律）\n- **只读 `shop_entitlement.expire_at` 一个字段**：空/过期 = 免费档；有效 = 付费档\n- **前端不读 `plan_id`**；套餐名/价格/文案/显隐**全部后端下发，前端禁硬编码**\n- 有效期以**服务端 UTC** 为准，前端只负责展示转北京时间\n\n### 2.5 iOS 支付降级（v1.4 §10.7）\n- iOS 端一次性套餐**必须真机实测**微信支付可用性\n- 不可用 → 引导至安卓端 / 鸿蒙端（**禁止 H5 购买页兜底**，违反微信运营规范 5.13）；禁硬编码 H5 跳转\n- **iOS 不展示 19.9 自动订阅**（苹果 IAP 抽成），仅放一次性套餐\n\n### 2.6 当前阶段（私域）\n`enable_real_payment=false`，支付入口隐藏或提示「联系客服开通」；权益由后台 `source=manual` 发放，**前端展示逻辑完全一致**（仍读 `expire_at`），执照下来改配置即可，**前端一行不改**。\n\n### 2.7 支付回调安全与表写入（对齐地基规范）\n- **回调签名校验**：微信支付回调必须校验官方签名，**绝不信任前端传入的支付结果**；签名校验通过再处理订单与权益发放，校验失败直接丢弃请求并记日志（`audit_log`）。\n- **幂等键维度**：支付回调幂等键为**全局 `transaction_id`（微信支付订单号）**，同一交易号重复回调直接返回成功，**不重复生成订单、不重复更新权益**，避免重复发放。\n- **写入表对齐第 8 章**：订单数据写入 `shop_payment_flow`，权益更新操作 `shop_entitlement`，表名、字段必须与第 8 章清单完全一致；所有操作写入 `audit_log` 留痕。\n\n### 2.8 免费配额计数（对齐软删规则）\n- 免费配额计数**仅统计 `is_deleted=false`** 的店铺与成本卡；已软删除（`is_deleted=true`）的数据**不占用配额**，由 DataAdapter 层统一过滤后计数，避免配额误判。\n\n## 3. 强制遵守\n- 权限判定只读 `expire_at`\n- 有效期服务端 UTC\n- 文案走 `i18n/terms.js`\n- 支付回调**只做两件事**：生成订单、更新 `expire_at`；`transaction_id` 幂等去重\n- 回调**先校验官方签名**，失败直接丢弃并记 `audit_log`；绝不信任前端传入的支付结果\n- 幂等键为**全局 `transaction_id`**，重复回调返回成功、不重复发权益\n- 订单写 `shop_payment_flow`、权益写 `shop_entitlement`、操作全写 `audit_log`（表字段对齐第 8 章）\n- 免费配额计数**仅含 `is_deleted=false`**，软删数据由 DataAdapter 过滤后计数\n- 到期提醒走「订阅消息 + 常驻提示条」双渠道\n\n## 4. ✅ 明确禁止\n- ❌ 不在\"进入页面/录入/修改/试算\"时触发付费弹窗\n- ❌ **不给 M2 弹任何付费窗**\n- ❌ 不硬编码价格、套餐名、文案（全部后端下发）\n- ❌ 不用前端本地时间判定有效期（防篡改）\n- ❌ 不在 iOS 展示自动订阅\n- ❌ 不实现退款（批次 6 后台做）\n- ❌ 不接真实支付（当前 `enable_real_payment=false`）\n- ❌ 不信任前端返回的支付结果（以服务端回调签名为准）\n- ❌ 不重复发放权益（同一 `transaction_id` 重复回调必须幂等）\n- ❌ 不让软删除数据占用免费配额\n\n## 5. 验收标准\n1. 第 2 家店保存 → 弹窗；**进入 M1 首页不弹窗**\n2. M2 全流程**一次弹窗都不出现**\n3. 免费用户看到「经营参考估算」，付费用户看到「真实利润」tab\n4. 篡改前端本地时间 → 权限判定不变（走服务端）\n5. iOS 端**看不到** 19.9 自动订阅项\n6. 所有付费按钮文案形如「开通真实利润」，页面**搜不到**「会员/订阅」字样\n\n## 输出要求\n给弹窗组件 + 订单页 + 权限判定工具代码，附自测结果表。"}, {"n": 6, "label": "批次 6 · 极简管理后台 H5（查询+调权+订单+退款+对账）", "text": "# 批次 6 / 8 · 极简管理后台 H5（用户查询 + 手动调权 + 订单管理 + 退款标记 + 导出对账）\n\n## 1. 批次定位\n第 6 批，**独立部署**的管理端，**不污染小程序包体**。**核心目标**：支撑私域收款时代的手动发权益、手动退款、对账——**没有它只能直接改数据库**，效率低且无留痕。\n\n## 2. 完整需求\n\n### 2.1 形态\n云开发静态托管的**独立 H5 管理页** + 一组 `admin*` 云函数；管理员用**独立账号**（非微信 openid）登录。UI 极简即可，能操作就行。\n\n### 2.2 五个 P0 功能\n1. **用户查询**：按 openid / 手机号 查 user + 其下 shop + `entitlement.expire_at` + 当前档位\n2. **手动发放/调整权益**：`source=manual`，**必填原因**\n3. **订单管理**：订单列表 + **私域订单手动录入**（金额/套餐/支付方式/时间/备注）\n4. **退款标记**：写 `order_refund`，**权收数据留**（标记已退款，权益回收，数据保留）\n5. **数据导出（对账）**：导出订单/权益明细 CSV（时间范围 + 导出人）\n\n### 2.3 🔴 `expire_at` 计算规则（对齐 v1.4 §10.10）\n| 当前状态 | 规则 |\n|---|---|\n| 权益**未到期** | 在**原 `expire_at` 基础上累加**天数，**不覆盖** |\n| 权益**已过期** | 从**操作当日**起计算新有效期（**不顺延**原到期） |\n\n- 所有操作写 `audit_log`，记录**前值/后值/原因/操作人**\n- 有效期用**服务端 UTC**\n\n### 2.4 🔴 `plan_id` 解耦\n`plan_id` **仅用于后台对账与统计**；**业务鉴权层与前端一律不读 plan_id**（权限只读 `expire_at`）。\n\n### 2.5 管理端鉴权（独立，禁复用用户端）\n- 所有 `admin*` 云函数统一走 **`adminAuth` 中间件**，校验 token 有效性与角色权限；**禁止绕过鉴权直接访问业务逻辑**\n- 角色权限隔离：运营账号**不可**访问管理员管理、全量导出等高危功能\n- 账号 + 密码，密码**加盐哈希**存储（禁明文、禁裸 MD5）\n- 登录成功生成 **7 天有效 token**，每次请求携带校验\n- **禁止复用微信 openid 鉴权**\n- **密码错误 5 次锁定账号 30 分钟**\n- 登录成功/失败均写 `admin_login_log`（时间/IP/结果）\n- 角色：超级管理员 / 运营两级；运营不能改管理员账号\n\n### 2.6 退款与权益回收（「权收数据留」）\n- 标记退款后，对应订单关联的权益**立即回收**：将用户 `expire_at` **回退至退款生效前的状态**；历史订单、数据与操作记录**永久保留、不做删除**。\n- 退款操作写入 `audit_log`，action 为 **`ADMIN_REFUND`**，记录前后值与原因。\n\n### 2.7 私域订单联动权益发放\n- 手动录入私域订单并标记「已支付」后，系统**自动**按对应套餐天数更新用户 `expire_at`（`source=manual`），**无需单独再走调权流程**。\n- 同步生成订单记录 + 权益变更审计日志。\n\n### 2.8 表名对齐第 8 章\n- 订单数据写入 `shop_payment_flow`，退款记录写入 `order_refund`，管理员账号与登录日志对应 `admin_user` / `admin_login_log`；**表名与字段必须与第 8 章清单完全一致，禁止新建额外表**。\n\n### 2.9 导出权限与留痕\n- 数据导出按角色控制权限：**仅超级管理员可导出全量数据，运营仅可导出订单明细**。\n- 所有导出操作写入 `audit_log`，记录导出人、导出时间、数据范围，操作留痕可追溯。\n\n## 3. 强制遵守\n- 所有后台操作写 `audit_log`，action 前缀 `ADMIN_`\n- 有效期服务端 UTC\n- 表：`admin_user` / `admin_login_log` / `order_refund`（已在批次 0 建好）\n- 所有 `admin*` 云函数过 `adminAuth` 中间件（token + 角色权限拦截）\n- 退款 action=`ADMIN_REFUND`，把 `expire_at` 回退至退款前状态、**数据/订单/记录不删**\n- 私域订单标记「已支付」**自动**发权益（`expire_at` 按套餐天数，`source=manual`），不同步走调权\n- 表对齐第 8 章（`shop_payment_flow` / `order_refund` / `admin_user` / `admin_login_log`），**禁止新建额外表**\n- 导出按角色控权：**全量仅超级管理员**，运营仅订单明细；导出写 `audit_log`（人/时间/范围）\n- 所有写操作（调权 / 录单 / 退款）校验 `client_request_id` 幂等，重复提交不重复处理、不重复留痕\n\n## 4. ✅ 明确禁止\n- ❌ **不复用微信 openid 做管理端鉴权**（必须独立账号体系）\n- ❌ 不明文存密码、不用裸 MD5\n- ❌ 不在\"未到期\"时**覆盖**原 expire_at（必须累加）\n- ❌ 不让业务层/前端读取 `plan_id`\n- ❌ 不跳过操作留痕\n- ❌ 不做复杂 UI / 不做数据大屏（极简即可）\n- ❌ 不修改用户端任何代码\n- ❌ 不让运营账号访问管理员管理 / 全量导出（角色隔离）\n- ❌ 不在标记退款时删除订单 / 数据 / 记录（仅回收权益）\n- ❌ 不新建未在第 8 章清单中的表\n- ❌ 不重复处理同一 `client_request_id` 的写操作（必须幂等）\n\n## 5. 验收标准\n1. 用错误密码连试 5 次 → 账号锁定 30 分钟\n2. 管理端登录态 7 天后失效，需重新登录\n3. 给**未到期**用户加 30 天 → 新 expire_at = 原值 + 30 天（**不是**从今天+30）\n4. 给**已过期**用户加 30 天 → 新 expire_at = 今天 + 30 天\n5. 每次调权在 `audit_log` 能看到前后值与操作人\n6. 手动录入一笔私域订单 → 订单列表可见，用户端权益同步生效\n7. 标记退款 → 权益回收、数据保留、`order_refund` 有记录\n8. 导出 CSV 能打开且字段完整\n\n## 输出要求\n给后台页面 + `admin*` 云函数代码，附自测结果表。"}, {"n": 7, "label": "批次 7 · 中优先级最简版（校验+loading+多店铺+导出）", "text": "# 批次 7 / 8 · 中优先级最简版（表单校验 + 加载状态 + 多店铺切换 + 数据导出）\n\n## 1. 批次定位\n第 7 批，体验打磨。**核心目标**：把 v1.0 交付前最容易让用户\"觉得难用\"的四件事补齐。\n\n## 2. 完整需求\n\n### 2.1 表单校验与错误提示\n- 金额**不能为负**、日期格式校验、必填项高亮提示、**全局统一错误弹窗**（按错误码映射文案）\n- ⚠️ **前端校验只为体验，云函数必须再校验一次**（前端校验不是安全边界）\n\n### 2.2 加载状态与防重复提交\n- 计算/提交显示 loading；按钮点击后立即 `disabled`，响应返回后恢复\n- 配合 `client_request_id` 幂等，防网络慢时重复提交导致云函数暴增\n\n### 2.3 多店铺切换\n- 顶部**店铺切换器**，切换即换 `shop_id`\n- 所有查询强制带 `shop_id`（数据隔离）\n- 免费用户仅 1 家，第 2 家触发付费弹窗（**仅保存时触发，切换时不触发**）\n\n### 2.4 数据导出\n- M1 报表 / M3 批量导出，格式 **Excel + JSON**\n- 文件名含店铺名 + 月份\n- **异步导出 + 进度提示**（大操作不阻塞）\n- 免费用户导出触发付费弹窗\n\n### 2.5 选做（v1.0 可简版）\n- 云函数**统一错误日志格式**（时间/函数名/openid/错误码/堆栈/入参脱敏）\n- 数据备份：明确云开发数据库备份周期与保留天数；误删优先走软删恢复\n\n### 2.6 错误码与文案全局统一\n- 表单校验、后端参数校验的错误码统一使用**全局标准错误码**（`INVALID_PARAM`、`FORBIDDEN` 等）；错误文案从 `i18n/terms.js` 映射，**禁止自定义错误码与硬编码文案**。\n\n### 2.7 店铺切换器：软删过滤 + 持久化（对齐全局软删规则）\n- 切换器列表**仅展示 `is_deleted=false`** 的店铺；已软删除的店铺不进入列表，也**不参与免费配额计数**（由数据层统一过滤）。\n- 当前选中店铺 `shop_id` **持久化到本地缓存**，用户下次进入默认打开上次访问的店铺，无需重复切换。\n\n### 2.8 导出权限解耦（对齐权限铁律）\n- 导出功能的权限判定**只读 `shop_entitlement.expire_at`**，**不读取 `plan_id`**；导出功能的开启/关闭、文案**全部由后端控制**，前端不做硬编码判断。\n\n### 2.9 日志脱敏与误删恢复（对齐安全/备份规范）\n- 普通业务日志**禁止输出**手机号、支付信息、`openid` 明文；仅 `audit_log` 可记录操作主体标识，且仅限后台有权限查看。\n- 数据误删**优先**通过恢复 `is_deleted=false` 找回；云开发数据库**按周自动备份、保留 30 天**；硬删除仅作数据清理最终手段，不用于日常恢复。\n\n### 2.10 隐私合规硬门槛（🔴 上线前必做，2023-09 起强制）\n- **《用户隐私保护指引》配置**：在微信公众平台 → 设置 → 服务内容声明 → 用户隐私保护指引，如实勾选收集的信息类型（openid / 昵称头像 / 存储 / 网络状态等）并写明用途；指引内容须与代码实际使用的接口**一一对应**。\n- **app.json 声明 `requiredPrivateInfos`**：用到的隐私接口在此声明。\n- **首次启动弹隐私协议**：用 `wx.getPrivacySetting` 判断是否需授权；用 `wx.onNeedPrivacyAuthorization` 注册回调、`wx.requirePrivacyAuthorize` 主动拉起弹窗；未同意前相关接口不得调用。\n- **撤回入口**：「我的」页提供\"隐私协议查看\"与\"撤回授权\"入口。\n- **合规红线**：禁止默认勾选\"同意\"；禁止把隐私同意与其他业务操作绑定（须可跳过）；同会话最多弹 2 次，拒绝后不得反复骚扰。\n\n### 2.11 账号注销入口（🔴 上线前必做，个人信息保护法要求）\n- 「我的 → 账号与安全 → 注销账号」入口；≤3 步，二次确认弹窗说明数据后果。\n- 后端：软删 `user` + **匿名化 `openid`/手机号/昵称**；关联 `shop`/`shop_entitlement` 置 `is_deleted=true` 或由定时任务脱敏；前端注销后立即退出登录、清本地缓存。\n- 承诺 15 个工作日内完成数据处理；无需硬删全量业务数据，关键是**提供入口 + 处理 PII**。\n\n## 3. 强制遵守\n- 前端校验 + 后端二次校验\n- 导出走异步，不阻塞\n- 所有查询带 `shop_id`\n- 文案走 `i18n/terms.js`\n- 错误码用全局标准（`INVALID_PARAM` / `FORBIDDEN`），文案从 i18n 映射\n- 店铺切换列表仅含 `is_deleted=false`，选中 `shop_id` 本地持久化\n- 导出权限只读 `expire_at`，不读 `plan_id`，开关/文案后端下发\n- 日志脱敏（禁落手机号/支付/openid 明文）；误删优先软删恢复 + 周备份保留 30 天\n- **隐私合规必做**：隐私指引配置 + app.json 声明 + 首次弹窗 + 撤回入口（§2.10）\n- **账号注销入口必做**：轻量实现，后端匿名化 PII（§2.11）\n\n## 4. ✅ 明确禁止\n- ❌ 不把前端校验当作安全边界（后端必须再校验）\n- ❌ 不做同步阻塞式导出\n- ❌ 不在切换店铺时弹付费窗\n- ❌ 不在日志里落手机号/支付信息等敏感内容\n- ❌ 不做埋点统计、帮助中心（排 v1.1+；**注销入口 v1.0 必须做**，见 §2.11）\n- ❌ 不自定义错误码 / 硬编码错误文案（统一走 i18n）\n- ❌ 不让已软删店铺进入切换列表或占用配额\n- ❌ 不上线前完成隐私指引配置与隐私弹窗（属审核硬阻塞）\n- ❌ 不读 `plan_id` 判定导出权限（只读 `expire_at`）\n- ❌ 不把硬删除用于日常恢复（优先软删恢复 + 备份）\n\n## 5. 验收标准\n1. 金额输入负数 → 前端拦截；绕过前端直接调云函数 → 后端也返回 `INVALID_PARAM`\n2. 快速连点保存按钮 → 只产生一条数据（disabled + 幂等生效）\n3. 多店铺切换 → 数据完全隔离，A 店看不到 B 店数据\n4. 导出大报表 → 显示进度，页面不卡死\n5. 免费用户点导出 → 弹付费窗；付费用户直接导出成功\n6. 日志中**搜不到**手机号明文\n\n## 输出要求\n给校验工具 + loading 组件 + 店铺切换器 + 导出任务代码，附自测结果表。"}];
const root = document.getElementById('root');
BLOCKS.forEach(b=>{
  const card = document.createElement('div'); card.className='card b'+b.n;
  const h2 = document.createElement('h2');
  h2.innerHTML = '<span><b>'+b.n+'</b> · '+b.label+'</span>';
  const btn = document.createElement('button'); btn.textContent='复制';
  h2.appendChild(btn);
  const ta = document.createElement('textarea'); ta.readOnly=true; ta.value=b.text;
  btn.onclick=()=>{
    ta.select();
    const done=()=>{btn.textContent='已复制✓';setTimeout(()=>btn.textContent='复制',1500);};
    if(navigator.clipboard){navigator.clipboard.writeText(b.text).then(done).catch(()=>{document.execCommand('copy');done();});}
    else{document.execCommand('copy');done();}
  };
  card.appendChild(h2); card.appendChild(ta); root.appendChild(card);
});
</script>
